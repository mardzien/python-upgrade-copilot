[project]
name = "python-upgrade-copilot"
version = "0.1.0.dev0"
description = "Auditable dependency-upgrade risk reports for Python pull requests, grounded in official documentation."
readme = "README.md"
authors = [{ name = "Marcin Lipiński" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "numpy>=2.1",
    "packaging>=24.2",
    "typer>=0.15",
]

[project.scripts]
upgrade-copilot = "upgrade_copilot.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "ty==0.0.104",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "upgrade_copilot"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# ty is pre-1.0: pinned in the dev group and run in CI as a non-blocking check.
# mypy (strict) remains the authoritative type gate.
[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
addopts = "-m 'not live' --strict-markers"
markers = ["live: requires network access or OPENAI_API_KEY"]
testpaths = ["tests"]
